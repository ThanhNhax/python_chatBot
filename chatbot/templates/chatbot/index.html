<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tư vấn tuyển sinh PTIT - Premium Chatbot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c8102e;
      --primary-dark: #9a0c23;
      --primary-light: #e81d3f;
      --bg-color: #f3f4f6;
      --chat-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1f2937;
      --text-light: #6b7280;
      --bot-msg: #f3f4f6;
      --user-msg: linear-gradient(135deg, var(--primary), var(--primary-light));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f7 0%, #d1d5db 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--text-main);
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 800px;
      background: var(--chat-bg);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    header {
      background: var(--user-msg);
      color: #fff;
      padding: 20px;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      box-shadow: 0 4px 12px rgba(200, 16, 46, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      padding: 2px;
    }

    #khung {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Tùy chỉnh thanh cuộn */
    #khung::-webkit-scrollbar {
      width: 6px;
    }
    #khung::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 10px;
    }

    .tin {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
      animation: slideUp 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bot {
      background: var(--bot-msg);
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .nguoi {
      background: var(--user-msg);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 10px rgba(200, 16, 46, 0.25);
    }

    /* Hiệu ứng gõ chữ */
    .typing {
      display: flex;
      gap: 4px;
      padding: 14px 16px;
      align-items: center;
    }
    
    .typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    
    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    #goiy {
      padding: 0 20px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    #goiy button {
      border: 1.5px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #goiy button:hover {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 10px rgba(200, 16, 46, 0.2);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 15px 20px;
      background: #fff;
      border-top: 1px solid #f3f4f6;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      background: #f9fafb;
    }

    input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    form button {
      background: var(--user-msg);
      color: #fff;
      border: 0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 10px rgba(200, 16, 46, 0.3);
    }

    form button:hover {
      transform: scale(1.05);
    }

    form button svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    footer {
      font-size: 0.75rem;
      color: var(--text-light);
      text-align: center;
      padding: 10px;
      background: #fff;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <header>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Trợ lý ảo PTIT
    </header>
    
    <div id="khung"></div>
    
    <div id="goiy"></div>
    
    <form id="form">
      <input id="o_nhap" placeholder="Hỏi về học phí, điểm chuẩn..." autocomplete="off">
      <button type="submit" title="Gửi">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
      </button>
    </form>
    
    <footer>Powered by PTIT Admission Team</footer>
  </div>

  <script>
    const khung = document.getElementById("khung");
    const form = document.getElementById("form");
    const oNhap = document.getElementById("o_nhap");

    // Lấy lịch sử chat từ LocalStorage
    let chatHistory = JSON.parse(localStorage.getItem('chatHistory')) || [];

    // Hàm lưu vào lịch sử
    function saveHistory(text, type) {
      chatHistory.push({ text, type });
      // Giữ lại tối đa 50 tin nhắn để không tràn bộ nhớ
      if (chatHistory.length > 50) chatHistory.shift();
      localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
    }

    function cuonXuong() {
      khung.scrollTop = khung.scrollHeight;
    }

    function themTin(noiDung, loai, isHistory = false) {
      const div = document.createElement("div");
      div.className = "tin " + loai;
      div.textContent = noiDung;
      khung.appendChild(div);
      cuonXuong();
      if (!isHistory) saveHistory(noiDung, loai);
    }

    // Hiệu ứng đang gõ
    let typingDiv = null;
    function hienTyping() {
      typingDiv = document.createElement("div");
      typingDiv.className = "tin bot typing";
      typingDiv.innerHTML = "<span></span><span></span><span></span>";
      khung.appendChild(typingDiv);
      cuonXuong();
    }

    function anTyping() {
      if (typingDiv) {
        typingDiv.remove();
        typingDiv = null;
      }
    }

    // Khôi phục lịch sử chat khi load trang
    function loadHistory() {
      if (chatHistory.length === 0) {
        themTin("Xin chào! Mình là trợ lý ảo tư vấn tuyển sinh PTIT. Bạn cần hỗ trợ thông tin gì?", "bot");
      } else {
        chatHistory.forEach(msg => themTin(msg.text, msg.type, true));
      }
    }

    async function hoi(cauHoi) {
      themTin(cauHoi, "nguoi");
      hienTyping();
      
      try {
        const res = await fetch("/chat/?q=" + encodeURIComponent(cauHoi));
        const data = await res.json();
        
        // Giả lập độ trễ nhỏ để nhìn tự nhiên hơn (600ms)
        setTimeout(() => {
          anTyping();
          themTin(data.answer, "bot");
        }, 600);

      } catch (e) {
        setTimeout(() => {
          anTyping();
          themTin("Hệ thống đang bận, vui lòng thử lại sau.", "bot");
        }, 600);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const cauHoi = oNhap.value.trim();
      if (!cauHoi) return;
      oNhap.value = "";
      hoi(cauHoi);
    });

    // Các nút gợi ý
    const goiYList = ["Ngành học", "Học phí", "Điểm chuẩn", "Học bổng", "Ký túc xá"];
    goiYList.forEach((chu) => {
      const nut = document.createElement("button");
      nut.type = "button";
      nut.textContent = chu;
      nut.onclick = () => hoi(chu);
      document.getElementById("goiy").appendChild(nut);
    });

    // Khởi chạy
    loadHistory();
  </script>
</body>

</html>
